name: Seed history images to R2

# One-off, manual-only: uploads every dossier image that exists in git
# history but not in the R2 bucket (notably *.field-notes.png, which the
# original seed skipped). Run before the history rewrite that purges
# docs/dossiers/images/ (docs/R2_IMAGES_MIGRATION.md step 8).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install boto3

      - name: Upload missing images
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/seed_missing_history_images_to_r2.py
