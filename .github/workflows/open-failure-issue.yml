name: Open Issue on Failure

on:
  workflow_run:
    workflows:
      - "Bluesky Engagement"
      - "Bluesky Outlet Reply (Walter Croncat)"
      - "Journalism Dry Run (Walter Croncat)"
      - "Journalism Publish (Walter Croncat)"
      - "Post and Pin Explainer"
      - "Post Correction"
      - "Rebuild Post History from X"
      - "Republish Draft (Walter Croncat)"
      - "Test Dedup (L4 LLM gate)"
      - "Track Analytics"
      - "Triage Review (Walter Croncat)"
      - "X Cat Repost (Native RT)"
      - "X Mention Reply (Walter Croncat)"
    types:
      - completed

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version: "3.11"

      - name: Open failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python scripts/open_failure_issue.py
