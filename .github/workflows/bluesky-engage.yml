name: Bluesky Engagement

on:
  # Run 4 times a day: 8am, 11am, 3pm, 8pm CDT (all within 7am–11pm CDT)
  # CDT is UTC-5, so times are 13:00, 16:00, 20:00, 01:00 UTC
  schedule:
    - cron: '0 13 * * *'  # 1 PM UTC = 8 AM CDT
    - cron: '0 16 * * *'  # 4 PM UTC = 11 AM CDT
    - cron: '0 20 * * *'  # 8 PM UTC = 3 PM CDT
    - cron: '0 1 * * *'   # 1 AM UTC = 8 PM CDT (prev day)

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/setup-python-env

      - name: Like mentions on Bluesky
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: |
          python scripts/bluesky_engage.py

      - name: Engage with cat community on Bluesky
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: |
          cd src
          python bluesky_engagement_bot.py

      - name: Commit engagement history
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bluesky_engagement_history.json

          if ! git diff --staged --quiet; then
            git commit -m "Update Bluesky engagement history [skip ci]"

            for i in {1..3}; do
              git pull --rebase --autostash origin main && git push && break || {
                echo "Push failed (attempt $i/3), retrying..."
                sleep $((i * 2))
              }
            done
          fi
