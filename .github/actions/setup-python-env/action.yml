name: 'Setup Python Environment'
description: 'Setup Python 3.11 and install dependencies (checkout must happen first)'

inputs:
  install-playwright-browser:
    description: 'Install Playwright Chromium browser binaries (only needed for journalism pipeline)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        timeout 300 pip install -r requirements.txt
        exit_code=$?
        if [ $exit_code -eq 124 ]; then
          echo "::error::pip install timed out after 5 minutes"
          exit 1
        elif [ $exit_code -ne 0 ]; then
          echo "::error::pip install failed with exit code $exit_code"
          exit $exit_code
        fi

    - name: Install Playwright Chromium browser
      if: inputs.install-playwright-browser == 'true'
      shell: bash
      run: |
        timeout 180 playwright install chromium --with-deps
        exit_code=$?
        if [ $exit_code -eq 124 ]; then
          echo "::error::playwright install timed out after 3 minutes"
          exit 1
        elif [ $exit_code -ne 0 ]; then
          echo "::error::playwright install failed with exit code $exit_code"
          exit $exit_code
        fi
